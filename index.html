<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Literacy Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@100;300;400;700&display=swap');
        
        :root {
            --bg-color: #000000;
            --text-color: #ffffff;
            --accent-color: #c41e3a; /* Vivid Ruby Wine */
            --accent-light: #ff2b4e;
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-border: rgba(255, 255, 255, 0.1);
            --sub-text: #94a3b8;
            --section-bg: #050505;
            --nav-bg: rgba(0, 0, 0, 0.5);
        }

        .light-mode {
            --bg-color: #fcfcfc;
            --text-color: #000000;
            --accent-color: #b91c1c; /* Strong Red */
            --accent-light: #dc2626;
            --card-bg: rgba(0, 0, 0, 0.02);
            --card-border: rgba(0, 0, 0, 0.08);
            --sub-text: #4b5563;
            --section-bg: #f3f4f6;
            --nav-bg: rgba(252, 252, 252, 0.8);
        }

        body {
            font-family: 'Pretendard', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            scroll-behavior: smooth;
            transition: background-color 0.5s ease, color 0.5s ease;
        }

        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--card-border);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .glass-card:hover {
            transform: scale(1.03);
            border-color: var(--accent-color);
            box-shadow: 0 20px 40px rgba(196, 30, 58, 0.15);
        }

        .bento-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .reveal {
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.8s ease-out;
        }

        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }

        .modal-blur {
            backdrop-filter: blur(15px);
            background: rgba(0, 0, 0, 0.85);
        }

        .light-mode .modal-blur {
            background: rgba(255, 255, 255, 0.85);
        }

        .profile-wrapper {
            position: relative;
            width: 160px;
            height: 160px;
            margin: 0 auto;
            border-radius: 50%;
            background: white; 
            padding: 5px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            border: 1px solid var(--card-border);
            overflow: hidden;
        }

        .profile-image {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: contain;
            transition: all 0.4s ease;
        }

        .profile-wrapper:hover .profile-image {
            transform: scale(1.1);
        }

        .profile-wrapper:hover {
            border-color: var(--accent-color);
            box-shadow: 0 0 30px rgba(196, 30, 58, 0.3);
        }

        .theme-toggle {
            cursor: pointer;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--card-border);
            transition: all 0.3s ease;
        }

        .theme-toggle:hover {
            border-color: var(--accent-color);
            color: var(--accent-color);
            background: rgba(196, 30, 58, 0.05);
        }

        .text-accent {
            color: var(--accent-color);
        }

        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-color);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--accent-color);
            border-radius: 10px;
        }
        
        .wine-glow {
            box-shadow: 0 0 25px rgba(196, 30, 58, 0.4);
        }
    </style>
</head>
<body class="selection:bg-[var(--accent-color)] selection:text-white">

    <nav class="fixed top-0 w-full z-40 px-6 py-4 flex justify-between items-center bg-[var(--nav-bg)] backdrop-blur-md border-b border-white/5">
        <div class="text-xl font-bold tracking-tighter flex items-center">
            <span class="w-3 h-3 bg-[var(--accent-color)] rounded-full mr-2 shadow-[0_0_10px_var(--accent-color)]"></span>
            AI LITERACY
        </div>
        <div class="flex items-center space-x-8">
            <div class="hidden md:flex space-x-8 text-sm font-light uppercase tracking-widest">
                <a href="#hero" class="hover:text-[var(--accent-color)] transition-colors">Home</a>
                <a href="#intro" class="hover:text-[var(--accent-color)] transition-colors">Goal</a>
                <a href="#gallery" class="hover:text-[var(--accent-color)] transition-colors">Portfolio</a>
                <a href="#about" class="hover:text-[var(--accent-color)] transition-colors">About</a>
            </div>
            <button id="themeToggle" class="theme-toggle">
                <i class="fas fa-moon" id="themeIcon"></i>
            </button>
        </div>
    </nav>

    <section id="hero" class="relative min-h-screen flex flex-col justify-center items-center px-6 text-center">
        <div class="absolute inset-0 overflow-hidden -z-10">
            <div class="absolute top-1/4 left-1/4 w-[600px] h-[600px] bg-[var(--accent-color)] opacity-[0.12] rounded-full blur-[120px]"></div>
            <div class="absolute bottom-1/4 right-1/4 w-[500px] h-[500px] bg-[var(--accent-color)] opacity-[0.05] rounded-full blur-[150px]"></div>
        </div>
        <h1 class="text-6xl md:text-9xl font-bold tracking-tighter mb-8 leading-none">
            AI Literacy:<br>
            <span class="font-extralight italic text-accent">Data & Story</span>
        </h1>
        <p class="text-lg md:text-xl font-light opacity-60 max-w-3xl leading-relaxed">
            현실의 문제를 데이터로 읽어내고, 생성형 AI의 지능을 빌려<br class="hidden md:block">
            세상을 변화시키는 <span class="text-[var(--accent-color)] font-bold">의미 있는 가치</span>를 제안합니다.
        </p>
        <div class="mt-12">
            <a href="#gallery" class="px-12 py-5 bg-[var(--accent-color)] text-white rounded-full font-bold hover:bg-[var(--accent-light)] transition-all wine-glow uppercase tracking-[0.2em] text-sm">
                Explore Work
            </a>
        </div>
    </section>

    <section id="gallery" class="py-32 px-6">
        <div class="max-w-7xl mx-auto">
            <div class="mb-16 reveal">
                <h2 class="text-5xl font-bold tracking-tighter">Portfolio Gallery</h2>
            </div>
            <div class="bento-grid" id="projectGrid"></div>
        </div>
    </section>

    <section id="about" class="py-32 px-6 bg-[var(--section-bg)]">
        <div class="max-w-4xl mx-auto reveal text-center">
            <div class="profile-wrapper mb-8">
                <img src="image_e4b682.png" alt="Profile" class="profile-image">
            </div>
            <h2 class="text-4xl font-bold mb-4">유 가 원</h2>
            <p class="opacity-60 font-light leading-relaxed text-lg">부산대학교 사회복지학과 22학번</p>
        </div>
    </section>

    <div id="modal" class="fixed inset-0 z-50 modal-blur hidden flex items-center justify-center p-4">
        <div class="bg-[var(--bg-color)] border border-[var(--accent-color)]/20 w-full max-w-3xl rounded-[2.5rem] overflow-hidden shadow-[0_0_100px_rgba(196,30,58,0.1)] relative">
            <button onclick="closeModal()" class="absolute top-8 right-8 text-3xl opacity-30 hover:text-[var(--accent-color)]">&times;</button>
            <div id="modalContent" class="p-10 md:p-16"></div>
        </div>
    </div>

    <script>
        const themeToggle = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');
        const body = document.body;

        themeToggle.addEventListener('click', () => {
            body.classList.toggle('light-mode');
            themeIcon.classList.toggle('fa-moon');
            themeIcon.classList.toggle('fa-sun');
        });

        const assignments = [
            { id: 1, title: "AI의 이해", tools: ["NotebookLM", "Gemini"], desc: "노트북LM을 활용하여 AI의 정의, 역사 및 생성형 AI의 핵심 개념을 체계적으로 정리합니다.", detail: "구글의 NotebookLM을 활용하여 방대한 AI 관련 문헌 자료를 업로드하고 흐름을 분석했습니다.", link: "./02/index.html" },
            { id: 2, title: "데이터 스토리텔링", tools: ["Gemini 스토리북"], desc: "공공데이터를 분석하고 인사이트를 도출하여 시각적으로 설득력 있는 리포트를 작성하여 스토리북으로 만들기", detail: "실제 사회 지표들을 분석하고 스토리북 형태의 디지털 리포트로 가공했습니다.", link: "./03/index.html" },
            { id: 3, title: "웹기술의 이해", tools: ["HTTP/3", "Client-Server"], desc: "현대 웹의 건축학적 구조와 프론트엔드/백엔드 메커니즘을 심층적으로 분석합니다.", detail: "웹의 기본 구조부터 최신 전송 프로토콜까지 웹 기술의 전반적인 흐름을 학습했습니다.", link: "./04/index.html" },
            { id: 4, title: "중간고사 과제", tools: ["Canva", "ChatGPT"], desc: "분석된 데이터를 토대로 설득력 있는 서사를 구축합니다.", detail: "데이터 경향성을 7단계 서사 구조로 변환하여 카드뉴스 형식의 보고서를 제작했습니다.", link: "https://gw-r.github.io/MiddleTest/" },
            { id: 5, title: "데이터분석(고령운전자)", tools: ["Matplotlib", "Seaborn"], desc: "코랩으로 데이터 분석", detail: "국내 고령 운전자 사고 데이터를 시각화하여 특정 연령층에서의 경향성을 분석하고 해결책을 모색했습니다.", link: "./05/index.html" },
            { id: 6, title: "유튜브 댓글분석", tools: ["Midjourney", "DALL-E 3"], desc: "추상적 개념을 시각적 콘텐츠로 변환하는 생성 능력을 키웁니다.", detail: "유튜브 댓글 분석을 통해 부산 관광 컨텐츠 기획안을 제작했습니다.", link: "./06/index.html" },
            { id: 7, title: "유튜브 댓글분석(2)", tools: ["Runway", "Luma"], desc: "텍스트와 이미지를 움직임이 있는 스토리로 확장합니다.", detail: "유튜브 댓글 분석을 통해 부산 관광의 성장 요인, 시민 반응, 문제점, 개선 방향을 도출하였습니다.", link: "./08/index.html" },
            { id: 8, title: "Antigravity 활용", tools: ["AI Tools"], desc: "특정 집단의 불편함을 해소하는 AI 서비스 모델을 기획합니다.", detail: "에이전틱 AI를 활용한 삶의 만족도와 자살률 간의 상관관계 분석", link: "./09/index.html" },
            { id: 9, title: "데이터 대시보드 구축", tools: ["Tableau", "Excel"], desc: "실시간으로 변화하는 데이터를 한눈에 파악하는 시스템을 만듭니다.", detail: "복지 시설 현황을 지도로 시각화하여 분석할 수 있는 대시보드를 제작했습니다." },
            { id: 10, title: "캡스톤: 나의 AI 비전", tools: ["Full Stack"], desc: "한 학기 동안 축적된 역량을 하나의 통합 포트폴리오로 승화시킵니다.", detail: "인간을 위한 AI 리터러시의 정의와 향후 로드맵을 제시했습니다." }
        ];

        const grid = document.getElementById('projectGrid');

        assignments.forEach((item, index) => {
            const card = document.createElement('div');
            card.className = "glass-card p-10 rounded-[2rem] cursor-pointer reveal group relative";
            card.onclick = (e) => {
                const arrowBtn = e.target.closest('.arrow-link');
                if (arrowBtn && item.link) {
                    e.stopPropagation();
                    window.open(item.link, '_blank');
                    return;
                }
                openModal(item);
            };
            
            card.innerHTML = `
                <div class="flex justify-between items-start mb-8">
                    <span class="text-xs font-mono text-[var(--accent-color)] font-bold opacity-60 uppercase tracking-widest">Assignment ${String(item.id).padStart(2, '0')}</span>
                    <div class="arrow-link w-10 h-10 rounded-full border border-[var(--accent-color)]/20 flex items-center justify-center group-hover:bg-[var(--accent-color)] group-hover:border-[var(--accent-color)] transition-all transform group-hover:rotate-45">
                        <i class="fas fa-arrow-right text-[10px] group-hover:text-white transition-all"></i>
                    </div>
                </div>
                <h3 class="text-2xl font-bold mb-4 group-hover:text-[var(--accent-color)] transition-colors tracking-tight">${item.title}</h3>
                <p class="text-sm opacity-50 font-light mb-8 line-clamp-2 leading-relaxed">${item.desc}</p>
                <div class="flex flex-wrap gap-2">
                    ${item.tools.map(tool => `<span class="px-3 py-1 bg-[var(--accent-color)]/5 rounded-full text-[10px] font-bold text-[var(--accent-color)] border border-[var(--accent-color)]/10">${tool}</span>`).join('')}
                </div>
            `;
            grid.appendChild(card);
        });

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => { if (entry.isIntersecting) entry.target.classList.add('active'); });
        }, { threshold: 0.1 });

        document.querySelectorAll('.reveal').forEach(el => observer.observe(el));

        function openModal(item) {
            const modal = document.getElementById('modal');
            const content = document.getElementById('modalContent');
            
            const actionText = item.title === "중간고사 과제" ? "사이트 이동" : "결과물 보기";
            
            content.innerHTML = `
                <h2 class="text-4xl font-bold mb-8 tracking-tighter leading-tight">${item.title}</h2>
                <div class="flex flex-wrap gap-3 mb-10">
                    ${item.tools.map(tool => `<span class="px-5 py-2 bg-[var(--accent-color)] text-white rounded-full text-xs font-bold">${tool}</span>`).join('')}
                </div>
                <div class="bg-[var(--accent-color)]/5 p-8 rounded-[2rem] border border-[var(--accent-color)]/20">
                    <p class="text-base md:text-lg opacity-90 leading-relaxed font-light">${item.detail}</p>
                </div>
                <div class="mt-12 pt-10 border-t border-[var(--card-border)] flex gap-4">
                    ${item.link ? `<a href="${item.link}" target="_blank" class="flex-1 text-center text-sm font-bold uppercase tracking-widest bg-[var(--accent-color)] text-white px-10 py-4 rounded-full shadow-lg shadow-[var(--accent-color)]/20 hover:scale-[1.02] transition-transform">${actionText}</a>` : ''}
                    <button onclick="closeModal()" class="flex-1 text-sm font-bold uppercase tracking-widest border border-[var(--card-border)] px-8 py-4 rounded-full hover:bg-[var(--text-color)] hover:text-[var(--bg-color)] transition-colors">닫기</button>
                </div>
            `;
            modal.classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            document.getElementById('modal').classList.add('hidden');
            document.body.style.overflow = 'auto';
        }
    </script>
</body>
</html>
